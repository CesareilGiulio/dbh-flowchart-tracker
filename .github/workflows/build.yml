name: Build Windows exe

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Scarica i nodi dei diagrammi dalla wiki
        run: npm run fetch-data
        continue-on-error: true
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: FlowchartTracker
          path: dist/FlowchartTracker.exe
      - name: Release (solo sui tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FlowchartTracker.exe
