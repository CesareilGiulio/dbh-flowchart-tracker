name: Build Windows exe

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compila
        run: cargo build --release --locked
      # versione portable: exe + cartella "dati" accanto, dove l'app salva i progressi
      - name: Crea lo zip portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg/FlowchartTracker/dati | Out-Null
          Copy-Item target/release/FlowchartTracker.exe pkg/FlowchartTracker/
          Copy-Item assets/LEGGIMI-portable.txt pkg/FlowchartTracker/dati/LEGGIMI.txt
          Copy-Item target/release/FlowchartTracker.exe .
          Compress-Archive -Path pkg/FlowchartTracker -DestinationPath FlowchartTracker-portable.zip
      - uses: actions/upload-artifact@v7
        with:
          name: FlowchartTracker
          path: |
            FlowchartTracker.exe
            FlowchartTracker-portable.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: FlowchartTracker
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            FlowchartTracker.exe
            FlowchartTracker-portable.zip
