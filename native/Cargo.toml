[package]
name = "flowchart-tracker"
version = "2.0.0"
edition = "2021"
description = "Tracker offline dei diagrammi di Detroit: Become Human (versione nativa)"
license = "MIT"
publish = false

[[bin]]
name = "FlowchartTracker"
path = "src/main.rs"

[dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
fontdue = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
rfd = "0.17"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
