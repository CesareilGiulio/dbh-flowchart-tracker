<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flowchart Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <header class="summary">
      <div class="count" id="ovCh">0 / 32</div>
      <div class="muted" data-i18n="chaptersFull"></div>
    </header>
    <nav class="filters" id="filters">
      <button data-f="all" class="on" data-i18n="all"></button>
      <button data-f="C">Connor</button>
      <button data-f="K">Kara</button>
      <button data-f="M">Markus</button>
    </nav>
    <ol class="chlist" id="chlist" aria-label="Chapters"></ol>
    <footer class="links">
      <button id="spoilBtn"></button>
      <button id="exportBtn" data-i18n="export"></button>
      <button id="importBtn" data-i18n="import"></button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
      <span class="lang" id="langSel"><button data-lang="it">Italiano</button> · <button data-lang="en">English</button></span>
    </footer>
  </aside>

  <main class="stage">
    <header class="head">
      <div class="head-left">
        <h1 id="chTitle"></h1>
        <div class="tabs" id="charTabs"></div>
        <div class="tabs sub" id="pathTabs"></div>
      </div>
      <div class="head-right">
        <div class="pct" id="chPct">0%</div>
        <label class="game"><input type="number" min="0" max="100" id="gamePct" placeholder="—"> <span data-i18n="gamePct"></span></label>
      </div>
    </header>
    <div class="canvas" id="canvas">
      <svg id="svg" aria-label="Chapter flowchart">
        <g id="world"><g id="edges"></g><g id="nodes"></g></g>
      </svg>
      <p class="empty" id="empty" data-i18n="noData" hidden></p>
      <div class="info" id="info" hidden><div class="info-title" id="infoTitle"></div><div class="info-note" id="infoNote"></div></div>
      <div class="zoom">
        <button id="zoomOut" aria-label="Zoom out">−</button>
        <button id="fitBtn" data-i18n="fit"></button>
        <button id="zoomIn" aria-label="Zoom in">+</button>
      </div>
    </div>
  </main>
</div>
<script src="i18n.js"></script>
<script src="chapters.js"></script>
<script src="app.js"></script>
</body>
</html>
